name: PR Lint keyboards

permissions:
  contents: read

on:
  pull_request:
    paths:
    - 'keyboards/**'
    - '.github/workflows/lint.yml'
    - '.github/qmk-upstream-base'

jobs:
  lint:
    runs-on: ubuntu-latest

    container: ghcr.io/qmk/qmk_cli

    steps:
    - name: Disable safe.directory check
      run : git config --global --add safe.directory '*'

    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install dependencies
      run: pip3 install -r requirements-dev.txt

    - name: Get changed files
      id: file_changes
      uses: tj-actions/changed-files@v47
      with:
        use_rest_api: true

    - name: Print git info
      run: |
        git rev-parse --short HEAD
        echo ${{ github.event.pull_request.base.sha }}
        echo '${{ steps.file_changes.outputs.all_changed_files}}'

    - name: Run qmk lint
      if: always()
      shell: 'bash {0}'
      run: |
        QMK_CHANGES=$(echo -e '${{ steps.file_changes.outputs.all_changed_files}}' | sed 's/ /\n/g')

        if [[ "$GITHUB_REPOSITORY" == "chadhs/qmk_firmware" ]]; then
          # An upstream sync imports keyboards that can have existing lint debt.
          # Lint every fork change against the recorded upstream release instead.
          UPSTREAM_BASE=$(cat .github/qmk-upstream-base) || exit 1
          git merge-base --is-ancestor "$UPSTREAM_BASE" HEAD || exit 1
          QMK_CHANGES=$(git diff --name-only --diff-filter=ACMR "$UPSTREAM_BASE" HEAD -- keyboards/) || exit 1

          # Parent-directory keymap/config changes are missed by the loop below.
          qmk lint --strict --keyboard boardsource/microdox/v1 --keymap chadhs || exit 1
          qmk lint --strict --keyboard ferris/sweep --keymap chadhs || exit 1
        fi

        QMK_KEYBOARDS=$(qmk list-keyboards)

        exit_code=0

        for KB in $QMK_KEYBOARDS; do
          KEYBOARD_CHANGES=$(echo "$QMK_CHANGES" | grep -E '^(keyboards/'${KB}'/)')
          if [[ -z "$KEYBOARD_CHANGES" ]]; then
            # skip as no changes for this keyboard
            continue
          fi

          KEYMAP_ONLY=$(echo "$KEYBOARD_CHANGES" | grep -cv /keymaps/)
          if [[ $KEYMAP_ONLY -gt 0 ]]; then
            echo "linting ${KB}"

            qmk lint --strict --keyboard ${KB} && qmk info -l --keyboard ${KB}
            exit_code=$(($exit_code + $?))
          fi
        done

        qmk format-text $QMK_CHANGES || true
        for file in $QMK_CHANGES; do
          if [[ -f $file ]]; then
            if ! git diff --quiet $file; then
              echo "File '${file}' Requires Formatting"
              echo "::error file=${file}::Requires Formatting"
              exit_code=$(($exit_code + 1))
            fi
          fi
        done

        if [[ $exit_code -gt 255 ]]; then
            exit 255
        fi
        exit $exit_code

    - name: Reset git repo
      if: always()
      shell: 'bash {0}'
      run: |
        git reset --hard
        git clean -xfd

    - name: Verify keyboard targets
      if: always()
      shell: 'bash {0}'
      run: |
        qmk ci-validate-keyboard-targets

    - name: Verify keyboard aliases
      if: always()
      shell: 'bash {0}'
      run: |
        qmk ci-validate-aliases
